  <style>
  /* Orders page specific styles — follow B&KERY theme */
  .orders-shell{max-width:1100px;margin:106px auto;padding:20px}
  .orders-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .orders-title{margin:0;font-size:32px;color:var(--brown)}
  .orders-sub{margin:6px 0 0;color:var(--lighter-black)}
  .orders-toolbar{display:flex;gap:12px;align-items:center}
  .orders-search{padding:10px 12px;border-radius:12px;border:1px solid rgba(82,47,28,.08);min-width:260px}
  .orders-filters{display:flex;gap:8px}
  .filter-btn{padding:8px 12px;border-radius:999px;border:1px solid rgba(82,47,28,.06);background:transparent;color:var(--brown);cursor:pointer}
  .filter-btn.active{background:var(--yellow);border-color:rgba(82,47,28,.06)}

  .orders-list{margin-top:18px;display:grid;gap:18px}
  .order-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 12px 30px rgba(82,47,28,0.08);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
  .order-summary{display:flex;flex-direction:column;gap:8px}
  .order-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .order-number{font-weight:800;color:var(--brown)}
  .order-date{color:#6d4a2d}
  .order-total{font-weight:900;color:var(--brown)}
  .order-method{color:rgba(0,0,0,.7)}

  .status-badge{padding:8px 12px;border-radius:999px;font-weight:800}
  .status-order-received{background:var(--yellow);color:#3d2113}
  .status-preparing{background:#8b5e46;color:#fff}
  .status-ready{background:#f6c85a;color:#3d2113}
  .status-completed{background:#4caf50;color:#fff}
  .status-pending{background:#ff9800;color:#fff}

.order-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
   .order-actions .btn{font-size:12px;padding:6px 12px;border-radius:999px;font-weight:600}
   .btn-view{background:var(--yellow);color:#3d2113;border:none}
   .btn-complete{background:#4caf50;color:#fff;border:none}
   .btn-delete{background:#f44336;color:#fff;border:none}
   .details-panel{margin-top:12px;border-radius:12px;padding:12px;background:linear-gradient(180deg,rgba(249,199,95,0.04),#fff);display:none}
   .details-panel.active{display:block}
  .items-list{display:grid;gap:8px}
  .item-row{display:flex;justify-content:space-between;gap:12px}
  .item-left{color:var(--brown);font-weight:700}
  .item-right{color:#6d4a2d; font-weight: 700;}

  .notice{margin-top:8px;color:var(--brown);font-weight:700}
  .empty-state{display:flex;flex-direction:column;align-items:center;gap:18px;padding:48px;border-radius:18px;background:linear-gradient(180deg,rgba(249,199,95,0.06),#fff);box-shadow:0 10px 28px rgba(82,47,28,0.06)}
  .empty-ill{width:180px;height:140px;background:linear-gradient(180deg,#fff,rgba(249,199,95,0.06));border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--brown);font-weight:900}

  @media(max-width:900px){
    .order-card{grid-template-columns:1fr;}
    .order-actions{align-items:flex-start}
  }

  @media(max-width:600px){
    .orders-toolbar{align-items:stretch;flex-direction:column; width:100%;}
    .orders-search{width:100%;min-width:0}
    .orders-filters{width:100%;flex-direction:column}
    .filter-btn{width:100%}
  }
</style>

  <script>
    (function initMobileMenu(){
      const toggle = document.querySelector('.mobile-menu-toggle');
      const panel = document.getElementById('mobile-menu-panel');
      const backdrop = document.getElementById('mobile-menu-backdrop');
      const closeButton = document.querySelector('.mobile-menu-close');
      if(!toggle || !panel || !backdrop || !closeButton) return;

      const setOpen = open => {
        panel.classList.toggle('open', open);
        backdrop.classList.toggle('open', open);
        toggle.setAttribute('aria-expanded', String(open));
        panel.setAttribute('aria-hidden', String(!open));
      };

      const closeMenu = () => setOpen(false);
      const toggleMenu = () => setOpen(!panel.classList.contains('open'));

      toggle.addEventListener('click', toggleMenu);
      closeButton.addEventListener('click', closeMenu);
      backdrop.addEventListener('click', closeMenu);
      panel.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));
    })();
  </script>

<script>
  // Orders page script — reads bk_orders from localStorage and renders cards
  (function(){
    const STORAGE_KEY = 'bk_orders';
    const DRAFT_STORAGE_KEY = 'bk_pending_orders';

    function readOrders(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return [];
        return JSON.parse(raw) || [];
      }catch(e){
        console.error('Failed to parse orders', e);
        return [];
      }
    }

    function readPendingOrders(){
      try{
        const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
        if(!raw) return [];
        return JSON.parse(raw) || [];
      }catch(e){
        return [];
      }
    }

    async function syncPendingOrdersToApi(orders){
      const token = localStorage.getItem('bk_auth_token');
      if(!token) return;
      try {
        await fetch('/api/pending-orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ orders })
        });
      } catch(e){ console.error('Failed to sync pending orders to API:', e); }
    }

    async function loadPendingOrdersFromApi(){
      const token = localStorage.getItem('bk_auth_token');
      if(!token) return;
      try {
        const resp = await fetch('/api/pending-orders', { headers: { 'Authorization': `Bearer ${token}` } });
        if(resp.ok){
          const data = await resp.json();
          if(data.orders && data.orders.length > 0){
            localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(data.orders));
          }
        }
      } catch(e){ console.error('Failed to load pending orders from API:', e); }
    }

    async function readAllGlobalOrders(){
      try {
        const resp = await fetch('/api/orders');
        if (resp.ok) {
          const data = await resp.json();
          return Array.isArray(data) ? data : [];
        }
        const errText = await resp.text().catch(() => 'Unknown error');
        console.error('Failed to fetch global orders:', resp.status, errText);
      } catch(e) {
        console.error('Error fetching global orders:', e);
      }
      return [];
    }

    async function readGlobalOrdersForLastCustomer(){
      try{
        const token = localStorage.getItem('bk_auth_token');
        const headers = {};
        if(token) headers['Authorization'] = `Bearer ${token}`;

        const lastOrder = JSON.parse(localStorage.getItem('bk_last_order') || 'null');
        const email = lastOrder?.email;
        if(email && !token){
          const resp = await fetch(`/api/orders?email=${encodeURIComponent(email)}`, { headers });
          if(!resp.ok){
            const errText = await resp.text().catch(() => '');
            console.error('Failed to fetch orders by email:', resp.status, errText);
            return await readAllGlobalOrders(headers);
          }
          const globalOrders = await resp.json();
          return Array.isArray(globalOrders) ? globalOrders : [];
        }

        const resp = await fetch('/api/orders', { headers });
        if(!resp.ok){
          const errText = await resp.text().catch(() => 'Unknown error');
          console.error('Failed to fetch global orders:', resp.status, errText);
          return [];
        }
        const globalOrders = await resp.json();
        return Array.isArray(globalOrders) ? globalOrders : [];
      }catch(e){
        console.error('Error fetching global orders:', e);
        return [];
      }
    }

    async function readAllGlobalOrders(headers = {}){
      try {
        const resp = await fetch('/api/orders', { headers });
        if (resp.ok) {
          const data = await resp.json();
          return Array.isArray(data) ? data : [];
        }
        const errText = await resp.text().catch(() => 'Unknown error');
        console.error('Failed to fetch global orders:', resp.status, errText);
      } catch(e) {
        console.error('Error fetching global orders:', e);
      }
      return [];
    }

    async function readAllOrders(){
       const localOrders = readOrders();
       const pendingOrders = readPendingOrders();
       const globalOrders = await readGlobalOrdersForLastCustomer();
       const byId = new Map();
       // Merge all orders: global -> local -> pending
       for(const order of [...globalOrders, ...localOrders, ...pendingOrders]){
         const id = order.orderId || order.orderNumber || order.id || `${order.email || ''}-${order.createdAt || order.savedAt || ''}`;
         byId.set(id, order);
       }
       return Array.from(byId.values());
     }

    function formatCurrency(n){
      const num = Number(n);
      if(isNaN(num)) return '$0.00';
      return '$' + num.toFixed(2);
    }

    function getOrderItems(order){
      return Array.isArray(order?.items)
        ? order.items
        : Array.isArray(order?.purchasedItems)
          ? order.purchasedItems
          : [];
    }

    function getOrderTotals(order){
      const items = getOrderItems(order);
      const itemSubtotal = items.reduce((sum, it) => sum + (Number(it?.price || it?.unitPrice || 0) * Number(it?.quantity || it?.qty || 1)), 0);
      const storedSubtotal = Number(order?.subtotal ?? order?.subTotal);
      const subtotal = items.length && Number.isFinite(itemSubtotal) ? itemSubtotal : (Number.isFinite(storedSubtotal) ? storedSubtotal : 0);
      const deliveryFee = String(order?.method || order?.pickupOrDelivery || '').toLowerCase() === 'delivery' ? 10 : 0;
      const total = items.length ? subtotal + deliveryFee : (Number(order?.total || order?.totalPaid || order?.amount || 0) || 0);
      return { subtotal, deliveryFee, total };
    }

    function formatOrderDateTime(dateStr){
      if(!dateStr) return '—';
      const d = new Date(dateStr);
      if(isNaN(d.getTime())) return '—';
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const month = months[d.getMonth()];
      const day = d.getDate();
      const year = d.getFullYear();
      let hours = d.getHours();
      const minutes = d.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const minStr = minutes < 10 ? '0'+minutes : minutes;
      return `${month} ${day}, ${year} at ${hours}:${minStr} ${ampm}`;
    }

    function formatScheduleTime(scheduleStr){
      if(!scheduleStr) return 'N/A — not specified';
      
      // Handle "YYYY-MM-DD at HH:MM" format
      const isoMatch = scheduleStr.match(/^(\d{4}-\d{2}-\d{2})\s*at\s*(\d{1,2}:\d{2})$/);
      if(isoMatch){
        const date = new Date(isoMatch[1] + 'T' + isoMatch[2]);
        if(!isNaN(date.getTime())){
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const month = months[date.getMonth()];
          const day = date.getDate();
          const year = date.getFullYear();
          let hours = date.getHours();
          const minutes = date.getMinutes();
          const ampm = hours >= 12 ? 'PM' : 'AM';
          hours = hours % 12 || 12;
          const minStr = minutes < 10 ? '0'+minutes : minutes;
          return `${month} ${day}, ${year} at ${hours}:${minStr} ${ampm}`;
        }
      }
      
      // Try parsing as a full date string
      const d = new Date(scheduleStr);
      if(isNaN(d.getTime())) return scheduleStr;
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const month = months[d.getMonth()];
      const day = d.getDate();
      const year = d.getFullYear();
      let hours = d.getHours();
      const minutes = d.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const minStr = minutes < 10 ? '0'+minutes : minutes;
      return `${month} ${day}, ${year} at ${hours}:${minStr} ${ampm}`;
    }

    function escapeHtml(str){
      if(!str) return '';
      return String(str).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
    }

    function getFirstName(name){
      const first = String(name || '').trim().split(/\s+/)[0];
      return first || 'there';
    }

function emailLink(email, name){
       const emailValue = String(email || '').trim();
       if(!emailValue || emailValue === '—') return '—';
       const firstName = String(name || '').trim().split(/\s+/)[0] || 'there';
       const body = `Hello ${firstName},\n\nYour order is ready for pickup.\n\nThank you,\nB&KERY`;
       const gmailLink = `https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(emailValue)}&su=${encodeURIComponent("Your B&KERY Order")}&body=${encodeURIComponent(body)}`;
       return `<a href="${gmailLink}" target="_blank" style="color:var(--brown)">${escapeHtml(emailValue)}</a>`;
     }

 function statusClass(status){
        switch((status||'').toLowerCase()){
          case 'preparing': return 'status-preparing';
          case 'ready for pickup': return 'status-ready';
          case 'delivered': return 'status-completed';
          case 'completed': return 'status-completed';
          case 'pending': return 'status-pending';
          case 'draft': return 'status-pending';
          case 'incomplete': return 'status-pending';
          default: return 'status-order-received';
 }
      }

      function isPendingOrder(order){
        const pending = readPendingOrders();
        const id = order.orderId || order.id;
        return pending.some(o => (o.orderId || o.id) === id);
      }

      function isActiveOrder(order){
        if(isPendingOrder(order)) return false;
        const paymentStatus = (order.paymentStatus || '').toLowerCase();
        const status = (order.status || '').toLowerCase();
        // Exclude orders with pending/draft/incomplete/failed payment
        if(paymentStatus.includes('pending') || paymentStatus.includes('draft') || paymentStatus.includes('incomplete') || paymentStatus.includes('failed')){
          return false;
        }
        // Exclude completed/delivered orders (check both status and paymentStatus)
        if(status === 'completed' || status === 'delivered' || paymentStatus === 'completed' || paymentStatus === 'delivered' || paymentStatus.includes('completed')){
          return false;
        }
        // Exclude orders with pending/draft/incomplete status
        if(status.includes('pending') || status.includes('draft') || status.includes('incomplete')){
          return false;
        }
        return true;
      }

      function renderEmpty(msg){
       const container = document.getElementById('orders-list');
       if(container){
         container.innerHTML = `<div class="empty-state">
           <div class="empty-ill">📭</div>
           <h3 style="margin:0;color:var(--brown)">${escapeHtml(msg || 'No orders found')}</h3>
         </div>`;
       }
     }

function renderOrders(list, isPending = false){
       const container = document.getElementById('orders-list');
       if(!container) return;
       container.innerHTML = '';
       const fragment = document.createDocumentFragment();

       list.forEach((order, idx) => {
         const card = document.createElement('div');
         card.className = 'order-card';
         card.setAttribute('data-order-id', order.orderId || order.id);

         // Sequential numbering: oldest = #1, newest = last number
         const orderNum = `#${list.length - idx}`;
         const { subtotal, deliveryFee, total } = getOrderTotals(order);
         const items = getOrderItems(order);
         const itemNames = items.map(it => it.name || it.productName).join(', ') || '—';

         const status = order.status || order.paymentStatus || (isPending ? 'Pending' : 'Pending Order');
         const statusCls = statusClass(status);

         // Build action buttons based on order type
         let actionButtons = `<span class="status-badge ${statusCls}">${escapeHtml(status)}</span>`;

         if(isPending){
           // Pending orders: View Details, Complete Order, Delete
           actionButtons = `
             <button class="btn btn-view" data-action="view" data-idx="${idx}">View Details</button>
             <button class="btn btn-complete" data-action="complete" data-idx="${idx}">Complete Order</button>
             <button class="btn btn-delete" data-action="delete" data-idx="${idx}">Delete</button>
           `;
         } else {
           // Active/other orders: View Details button
           actionButtons = `
             <button class="btn btn-view" data-action="view" data-idx="${idx}">View Details</button>
             <span class="status-badge ${statusCls}">${escapeHtml(status)}</span>
           `;
         }

         card.innerHTML = `
           <div class="order-summary">
             <div class="order-meta">
               <span class="order-number">${escapeHtml(orderNum)}</span>
               <span class="order-date">${formatOrderDateTime(order.createdAt || order.date || order.savedAt)}</span>
               <span class="order-total">${formatCurrency(total)}</span>
               <span class="order-method">${escapeHtml(order.method || order.pickupOrDelivery || '—')}</span>
             </div>
             <div class="item-name">${escapeHtml(itemNames)}</div>
           </div>
           <div class="order-actions">${actionButtons}</div>
           <div class="details-panel" id="details-${order.orderId || order.id || idx}"></div>
         `;

         fragment.appendChild(card);
       });

container.appendChild(fragment);

       // Attach event handlers after rendering
       attachOrderActionHandlers(list, isPending);
     }

     function attachOrderActionHandlers(orders, isPending){
       const viewButtons = document.querySelectorAll('[data-action="view"]');
       const completeButtons = document.querySelectorAll('[data-action="complete"]');
       const deleteButtons = document.querySelectorAll('[data-action="delete"]');

       viewButtons.forEach(btn => {
         btn.addEventListener('click', (e) => {
           const idx = parseInt(e.target.getAttribute('data-idx'));
           const order = orders[idx];
           if(order) toggleOrderDetails(order);
         });
       });

       completeButtons.forEach(btn => {
         btn.addEventListener('click', (e) => {
           const idx = parseInt(e.target.getAttribute('data-idx'));
           const order = orders[idx];
           if(order) completePendingOrder(order);
         });
       });

       deleteButtons.forEach(btn => {
         btn.addEventListener('click', (e) => {
           const idx = parseInt(e.target.getAttribute('data-idx'));
           const order = orders[idx];
           if(order) deletePendingOrder(order);
         });
       });
     }

     function toggleOrderDetails(order){
       const panelId = `details-${order.orderId || order.id}`;
       const panel = document.getElementById(panelId);
       if(!panel) return;

       const items = getOrderItems(order);
       const { subtotal, deliveryFee, total } = getOrderTotals(order);

       if(panel.classList.contains('active')){
         panel.classList.remove('active');

               <div class="detail-section"><h4>Customer</h4>
                 <div class="detail-row"><span class="label">Name: </span><span class="value">${escapeHtml(order.name || order.customerName || '—')}</span></div>
                 <div class="detail-row"><span class="label">Email: </span><span class="value">${escapeHtml(order.email || order.customerEmail || '—')}</span></div>
                 <div class="detail-row"><span class="label">Phone: </span><span class="value">${escapeHtml(order.phone || order.customerPhone || '—')}</span></div>
               </div>
               <div class="detail-section"><h4>Order</h4>
                 <div class="detail-row"><span class="label">Method: </span><span class="value">${escapeHtml(order.method || order.pickupOrDelivery || '—')}</span></div>
                 <div class="detail-row"><span class="label">Address: </span><span class="value">${escapeHtml(order.address || order.pickupLocation || '—')}</span></div>

               </div>

         `;
       }
     }

     function getOrderDetailsItemsHtml(items){
       if(!items || !items.length) return '<div style="color:var(--gray);font-style:italic">No items</div>';
       return `
         <table class="items-table">
           <thead><tr><th>Item</th><th style="text-align:center">Qty</th><th style="text-align:right">Price</th></tr></thead>
           <tbody>${items.map(it => `<tr><td>${escapeHtml(it.name || it.productName || '—')}</td><td style="text-align:center">${it.quantity || 1}</td><td style="text-align:right">${formatCurrency(it.price || it.unitPrice || 0)}</td></tr>`).join('')}</tbody>
         </table>
       `;
     }

      function completePendingOrder(order){
        // Store the pending order to checkout and redirect to cart for payment
        try {
          const checkout = {
            name: order.name || order.customerName || '',
            phone: order.phone || order.customerPhone || '',
            email: order.email || order.customerEmail || '',
            method: order.method || order.pickupOrDelivery || 'Pickup',
            pickupLocation: order.pickupLocation || '',
            address: order.address || '',
            city: order.city || '',
            state: order.state || '',
            zip: order.zip || '',
            notes: order.notes || '',
            bagelType: order.bagelType || '',
            macaronType: order.macaronType || '',
            rugelachFilling: order.rugelachFilling || ''
          };
          sessionStorage.setItem('bk_checkout', JSON.stringify(checkout));
          if(order.items && order.items.length){
            const cart = order.items.map(item => ({
              id: item.id || item.productId || '',
              name: item.name || item.productName || 'Item',
              price: parseFloat(item.price || item.unitPrice || 0),
              quantity: parseInt(item.quantity || 1),
              image: item.image || ''
            }));
            localStorage.setItem('bk_cart', JSON.stringify(cart));
          }
          // Remove from pending orders and sync
          const existing = JSON.parse(localStorage.getItem('bk_pending_orders') || '[]');
          const id = order.orderId || order.id;
          const filtered = existing.filter(o => (o.orderId || o.id) !== id);
          localStorage.setItem('bk_pending_orders', JSON.stringify(filtered));
          syncPendingOrdersToApi(filtered);
          window.location.href = 'cart.html';
        } catch(e) {
          console.error('Error completing pending order:', e);
          alert('Could not process order. Please try again.');
        }
      }

      function deletePendingOrder(order){
        if(!confirm('Are you sure you want to delete this pending order?')) return;
        try {
          const existing = JSON.parse(localStorage.getItem('bk_pending_orders') || '[]');
          const id = order.orderId || order.id;
          const filtered = existing.filter(o => (o.orderId || o.id) !== id);
          localStorage.setItem('bk_pending_orders', JSON.stringify(filtered));
          syncPendingOrdersToApi(filtered);
          // Refresh the orders list
          readAllOrders().then(orders => {
            applySearchAndFilter(orders);
            updateOrdersCount(orders);
          });
        } catch(e) {
          console.error('Error deleting pending order:', e);
        }
      }

      function updateOrdersCount(orders){
        const filter = document.querySelector('.filter-btn.active')?.getAttribute('data-filter') || 'all';
        let count = orders.length;

         // Adjust count based on filter
         if(filter === 'active'){
           count = orders.filter(o => isActiveOrder(o)).length;
         } else if(filter === 'completed'){
           count = orders.filter(o => {
             const status = (o.status||'').toLowerCase();
             const paymentStatus = (o.paymentStatus||'').toLowerCase();
             return status === 'completed' || status === 'delivered' || 
                    paymentStatus === 'completed' || paymentStatus === 'delivered' ||
                    paymentStatus.includes('completed');
           }).length;
         } else if(filter === 'pending'){
           const localPending = readPendingOrders();
           const apiPending = orders.filter(o => {
             const status = (o.status||'').toLowerCase();
             const paymentStatus = (o.paymentStatus||'').toLowerCase();
             return (status.includes('pending') || status.includes('draft') || status.includes('incomplete')) &&
                    !(paymentStatus === 'completed' || paymentStatus === 'delivered' || paymentStatus.includes('completed'));
           });
           // Deduplicate
           const allPending = [...localPending];
           for (const apiOrder of apiPending) {
             const id = apiOrder.orderId || apiOrder.id;
             if (!allPending.some(p => (p.orderId || p.id) === id)) {
               allPending.push(apiOrder);
             }
           }
           count = allPending.length;
         }

        document.querySelectorAll('.orders-count').forEach(el => el.textContent = count);
      }

      // ─── Auth helpers ───────────────────────────────────────────────────────
      function getOrdersAuthToken(){
        return localStorage.getItem('bk_auth_token') || null;
      }

      function getAuthUser(){
        try { return JSON.parse(localStorage.getItem('bk_auth_user') || 'null'); } catch(e){ return null; }
      }

      function clearAuth(){
        localStorage.removeItem('bk_auth_token');
        localStorage.removeItem('bk_auth_user');
      }

      function updateOrdersAuthUI(){
        const user = getAuthUser();
        const btn = document.getElementById('orders-auth-btn');
        if(!btn) return;
        if(user){
          btn.className = 'btn btn-auth-user';
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Hi, ${(user.name || user.email || 'User').split(' ')[0]}`;
          btn.onclick = () => openProfileModal();
        } else {
          btn.className = 'btn btn-ghost';
          btn.textContent = 'Sign In';
          btn.onclick = () => { window.BK_openAuthModal(); };
        }
      }

      function openProfileModal(){
        const user = getAuthUser();
        if(!user) return;
        document.getElementById('profile-user-name').textContent = user.name || 'B&KERY Member';
        document.getElementById('profile-user-email').textContent = user.email || '';
        const overlay = document.getElementById('profile-modal-overlay');
        if(overlay){
          overlay.classList.add('open');
          overlay.setAttribute('aria-hidden', 'false');
        }
      }

      function closeProfileModal(){
        const overlay = document.getElementById('profile-modal-overlay');
        if(overlay){
          overlay.classList.remove('open');
          overlay.setAttribute('aria-hidden', 'true');
        }
      }

     function applySearchAndFilter(all){
        const q = (document.getElementById('orders-search').value || '').trim().toLowerCase();
        const filter = document.querySelector('.filter-btn.active')?.getAttribute('data-filter') || 'all';
        let list = all.slice();
        list.sort((a, b) => {
          const da = new Date(b.createdAt || b.dateOrdered || b.date || b.savedAt || 0);
          const db = new Date(a.createdAt || a.dateOrdered || a.date || a.savedAt || 0);
          return da - db;
        });
        if(filter === 'active'){
          list = list.filter(o => isActiveOrder(o));
        } else if(filter === 'completed'){
          list = list.filter(o => {
            const status = (o.status||'').toLowerCase();
            const paymentStatus = (o.paymentStatus||'').toLowerCase();
            return status === 'completed' || status === 'delivered' || 
                   paymentStatus === 'completed' || paymentStatus === 'delivered' ||
                   paymentStatus.includes('completed');
          });
        } else if(filter === 'pending'){
          // Merge local draft orders with API orders that have pending status
          const localPending = readPendingOrders();
          const apiPending = all.filter(o => {
            const status = (o.status||'').toLowerCase();
            const paymentStatus = (o.paymentStatus||'').toLowerCase();
            return (status.includes('pending') || status.includes('draft') || status.includes('incomplete')) &&
                   !(paymentStatus === 'completed' || paymentStatus === 'delivered' || paymentStatus.includes('completed'));
          });
          // Deduplicate by ID
          const allPending = [...localPending];
          for (const apiOrder of apiPending) {
            const id = apiOrder.orderId || apiOrder.id;
            if (!allPending.some(p => (p.orderId || p.id) === id)) {
              allPending.push(apiOrder);
            }
          }
          if(!q && allPending.length > 0){
            list = allPending.slice().sort((a, b) => new Date(b.savedAt || b.createdAt || b.dateOrdered || 0) - new Date(a.savedAt || a.createdAt || a.dateOrdered || 0));
          } else if (allPending.length > 0) {
            list = allPending.filter(o => {
              const orderId = (o.id||o.orderId||o.orderNumber||'').toLowerCase();
              const inItems = (o.items||o.purchasedItems||[]).some(it => (it.name||it.productName||'').toLowerCase().includes(q));
              return orderId.includes(q) || inItems;
            }).slice().sort((a, b) => new Date(b.savedAt || b.createdAt || b.dateOrdered || 0) - new Date(a.savedAt || a.createdAt || a.dateOrdered || 0));
          } else {
            list = [];
          }
        }
        if(q && filter !== 'pending'){
          list = list.filter(o => {
            const orderId = (o.orderNumber||o.orderId||'').toLowerCase();
            const inItems = (o.purchasedItems||o.items||[]).some(it => (it.name||it.productName||'').toLowerCase().includes(q));
            return orderId.includes(q) || inItems;
          });
        }
        if(list.length === 0){ renderEmpty(); return; }
        renderOrders(list, filter === 'pending');
      }

    function getSubmittedOrderCount(){
      try{
        const orders = readOrders() || [];
        return orders.filter(order => {
          const status = `${order.status || ''} ${order.paymentStatus || ''}`.toLowerCase();
          return !(status.includes('pending') || status.includes('draft') || status.includes('incomplete'));
        }).length;
      }catch(e){
        return 0;
      }
    }

async function init(){
       const user = getAuthUser();
       
       // Load user's pending orders from API if logged in, before reading all orders
       if(user){
         await loadPendingOrdersFromApi();
       }

       const all = await readAllOrders();
       const searchInput = document.getElementById('orders-search');
       const filterBtns = document.querySelectorAll('.filter-btn');

       document.querySelectorAll('.cart-count').forEach(el => {
         try{ const cart = JSON.parse(localStorage.getItem('bk_cart')||'[]'); el.textContent = cart.reduce((s,it)=>s+(it.quantity||0),0); }catch(e){}
       });
       try { document.querySelectorAll('.orders-count').forEach(el => el.textContent = getSubmittedOrderCount()); } catch (e) {}

       updateOrdersAuthUI();

       if(!all || all.length === 0){ renderEmpty('No orders yet. Your orders will appear here.'); }
       else { applySearchAndFilter(all); }

        searchInput.addEventListener('input', async () => {
          const updated = await readAllOrders();
          applySearchAndFilter(updated);
        });
        filterBtns.forEach(btn => btn.addEventListener('click', async (e) => {
          filterBtns.forEach(b=>b.classList.remove('active'));
          e.currentTarget.classList.add('active');
          const updated = await readAllOrders();
          applySearchAndFilter(updated);
        }));

        document.getElementById('orders-auth-btn')?.addEventListener('click', () => {
          const user = getAuthUser();
          if(user){
            openProfileModal();
          } else {
            window.BK_openAuthModal();
          }
        });

        document.getElementById('profile-modal-close')?.addEventListener('click', closeProfileModal);
        document.getElementById('profile-modal-overlay')?.addEventListener('click', (e) => {
          if(e.target === e.currentTarget) closeProfileModal();
        });
        document.getElementById('profile-logout-btn')?.addEventListener('click', async () => {
          closeProfileModal();
          clearAuth();
          localStorage.removeItem('bk_cart');
          localStorage.removeItem('bk_pending_orders');
          updateOrdersAuthUI();
          // Refresh orders list after logout
          const updated = await readAllOrders();
          applySearchAndFilter(updated);
          updateOrdersCount(updated);
        });

       window.addEventListener('storage', async (ev) => {
         if(ev.key === STORAGE_KEY || ev.key === DRAFT_STORAGE_KEY || ev.key === 'bk_last_order'){
           const updated = await readAllOrders();
           document.querySelectorAll('.orders-count').forEach(el => el.textContent = getSubmittedOrderCount());
           applySearchAndFilter(updated);
         }
       });
       document.addEventListener('visibilitychange', async () => {
         if(document.visibilityState === 'visible'){
           const updated = await readAllOrders();
           document.querySelectorAll('.orders-count').forEach(el => el.textContent = getSubmittedOrderCount());
           applySearchAndFilter(updated);
         }
       });
     }

document.addEventListener('DOMContentLoaded', () => init());
   })();
 </script>
 <script>
 (function initProductSearch(){
   const searchToggles = Array.from(document.querySelectorAll('#search-toggle, #search-toggle-mobile'));
   const searchContainer = document.getElementById('search-container');
   const searchInput = document.getElementById('search-input');
   const searchClear = document.getElementById('search-clear');
   const searchResults = document.getElementById('search-results');
   const searchHint = document.getElementById('search-hint');

   if(searchToggles.length === 0 || !searchContainer || !searchInput || !searchResults) return;

   const bakeryProducts = [
     { name: 'Babka', id: 'babka' },
     { name: 'Challah', id: 'challah' },
     { name: 'Bagels', id: 'bagels' },
     { name: 'Bialys', id: 'bialys' },
     { name: 'Rugelach', id: 'rugelach' },
     { name: 'Almond Thumbprint Cookies', id: 'almond-cookies' },
     { name: 'Mandelbrot', id: 'mandelbrot' },
     { name: 'Macarons', id: 'macarons' },
     { name: 'Greater-Crumb Coffee Cake', id: 'coffee-cake' }
   ];

   let selectedIndex = -1;
   let currentResults = [];

   const toggleSearch = () => {
     const isOpen = searchContainer.getAttribute('aria-hidden') === 'false';
     if(isOpen){ closeSearch(); } else { openSearch(); }
   };

   const openSearch = () => {
     positionSearchContainer();
     searchContainer.setAttribute('aria-hidden', 'false');
     searchToggles.forEach(toggle => toggle.setAttribute('aria-expanded', 'true'));
     searchInput.focus();
   };

   const getVisibleSearchToggle = () => searchToggles.find(toggle => {
     const style = getComputedStyle(toggle);
     return style.display !== 'none' && style.visibility !== 'hidden' && toggle.getClientRects().length > 0;
   }) || searchToggles[0];

   const positionSearchContainer = () => {
     const toggle = getVisibleSearchToggle();
     if(!toggle) return;
     const toggleRect = toggle.getBoundingClientRect();
     const width = Math.min(320, Math.max(260, window.innerWidth - 16));
     const left = Math.max(8, toggleRect.right - width);
     searchContainer.style.position = 'fixed';
     searchContainer.style.top = toggleRect.bottom + 8 + 'px';
     searchContainer.style.width = width + 'px';
     searchContainer.style.left = left + 'px';
     searchContainer.style.right = 'auto';
   };

   const closeSearch = () => {
     searchContainer.setAttribute('aria-hidden', 'true');
     searchToggles.forEach(toggle => toggle.setAttribute('aria-expanded', 'false'));
     searchResults.innerHTML = '';
     selectedIndex = -1;
   };

   const filterProducts = (query) => {
     if(!query.trim()){
       searchResults.innerHTML = '';
       searchHint.style.display = 'block';
       selectedIndex = -1;
       return;
     }
     const lowerQuery = query.toLowerCase().trim();
     currentResults = bakeryProducts.filter(product => product.name.toLowerCase().includes(lowerQuery));
     selectedIndex = -1;
     renderResults();
   };

   const renderResults = () => {
     searchHint.style.display = 'none';
     searchResults.innerHTML = '';
     if(currentResults.length === 0){
       const emptyMsg = document.createElement('div');
       emptyMsg.className = 'search-empty';
       emptyMsg.textContent = 'No matching treats found.';
       searchResults.appendChild(emptyMsg);
       return;
     }
     currentResults.forEach((product, index) => {
       const item = document.createElement('button');
       item.type = 'button';
       item.className = 'search-result-item';
       item.textContent = product.name;
       item.setAttribute('data-index', index);
       item.addEventListener('click', () => selectResult(index));
       searchResults.appendChild(item);
     });
   };

   const selectResult = (index) => {
     if(index < 0 || index >= currentResults.length) return;
     window.location.href = 'index.html#menu';
     closeSearch();
     searchInput.value = '';
   };

   const updateSelection = (newIndex) => {
     if(currentResults.length === 0) return;
     if(newIndex < 0) newIndex = currentResults.length - 1;
     if(newIndex >= currentResults.length) newIndex = 0;
     selectedIndex = newIndex;
     document.querySelectorAll('.search-result-item[data-selected]').forEach(item => {
       item.removeAttribute('data-selected');
     });
     const selected = document.querySelector(`.search-result-item[data-index="${selectedIndex}"]`);
     if(selected){
       selected.setAttribute('data-selected', '');
       selected.scrollIntoView({ block: 'nearest' });
     }
   };

   searchToggles.forEach(toggle => toggle.addEventListener('click', toggleSearch));
   window.addEventListener('resize', positionSearchContainer);
   searchInput.addEventListener('input', (e) => filterProducts(e.target.value));
   searchClear.addEventListener('click', (e) => {
     e.preventDefault();
     searchInput.value = '';
     searchResults.innerHTML = '';
     searchHint.style.display = 'block';
     selectedIndex = -1;
     searchInput.focus();
   });
   searchInput.addEventListener('keydown', (e) => {
     if(e.key === 'Escape'){ closeSearch(); return; }
     if(e.key === 'ArrowDown'){ e.preventDefault(); updateSelection(selectedIndex + 1); return; }
     if(e.key === 'ArrowUp'){ e.preventDefault(); updateSelection(selectedIndex - 1); return; }
     if(e.key === 'Enter'){ e.preventDefault(); if(selectedIndex >= 0) selectResult(selectedIndex); return; }
   });
   document.addEventListener('click', (e) => {
     if(!searchContainer.contains(e.target) && !searchToggles.some(toggle => toggle.contains(e.target))){
       if(searchContainer.getAttribute('aria-hidden') === 'false'){ closeSearch(); }
     }
   });
   document.addEventListener('keydown', (e) => {
     if(e.key === 'Escape' && searchContainer.getAttribute('aria-hidden') === 'false'){ closeSearch(); }
   });
 })();
 </script>
